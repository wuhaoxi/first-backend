spring:
  application:
    name: my-first-project-backend
  profiles:
    active: dev
  data:
    web:
      pageable:
        max-page-size: 100
    redis:
      host: localhost
      port: 6379
  ai:
    openai:
      # Placeholder keeps the context bootable when DEEPSEEK_API_KEY is unset;
      # real calls are gated by app.assistant.api-key (blank -> 503).
      api-key: ${DEEPSEEK_API_KEY:sk-not-configured}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: deepseek-chat

server:
  port: 8080

app:
  cache:
    ranking-ttl: 5m
  assistant:
    # Gate: blank key (env unset) keeps the endpoint at 503 and no model call.
    api-key: ${DEEPSEEK_API_KEY:}
    history-ttl: 24h
    window-messages: 20
    window-chars: 6000
    max-message-length: 2000
    rate-limit-per-minute: 10
  knowledge-base:
    # Gate: blank key (env unset) keeps indexing a no-op and the search tool inert;
    # the real key lives only in the environment (ZHIPU_API_KEY).
    embedding-api-key: ${ZHIPU_API_KEY:}
    embedding-base-url: https://open.bigmodel.cn/api/paas/v4
    embedding-model: embedding-3
    embedding-dimensions: 2048
    top-k: 4
    chunk-size-chars: 800
    chunk-overlap-chars: 100
    chroma-url: http://localhost:8000
    collection-name: wanderchina_knowledge
  jwt:
    secret: this-is-a-test-secret-key-for-dev-only-change-in-production
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
